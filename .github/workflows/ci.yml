name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  dotnet:
    name: C# tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 9.0.x
      - run: dotnet test tests/LoadingScreen.Tests

  site:
    name: Site tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test "tests/site/*.test.mjs"

  integrity:
    name: Vendored binaries and version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify ServerSync.dll
        working-directory: lib/ServerSync
        run: sha256sum --check --strict ServerSync.dll.sha256
      - name: Check that manifest.json and PluginVersion agree
        run: |
          manifest=$(jq -r .version_number manifest.json)
          plugin=$(sed -nE 's/.*PluginVersion = "([^"]+)".*/\1/p' src/Plugin/LoadingScreen.cs)
          echo "manifest.json: $manifest, PluginVersion: $plugin"
          test "$manifest" = "$plugin"
